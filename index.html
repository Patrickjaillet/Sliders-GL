<!-- §1.1 FOUC prevention: apply saved theme class before first paint -->
<script>
  (function(){
    document.documentElement.classList.add('no-transition');
    // Défaut sombre ; respecte la préférence persistée (sl_theme / sl_theme_name).
    try {
      var mode = localStorage.getItem('sl_theme') || 'dark';
      var named = localStorage.getItem('sl_theme_name');
      var cls = 'dark-theme';
      if (named && named !== 'dark') {
        cls = named + '-theme';
      } else if (mode === 'light') {
        cls = 'light-theme';
      } else if (mode === 'system') {
        cls = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark-theme' : 'light-theme';
      }
      document.documentElement.classList.add(cls);
    } catch (e) {
      document.documentElement.classList.add('dark-theme');
    }
    window.addEventListener('load', function() {
      setTimeout(function(){ document.documentElement.classList.remove('no-transition'); }, 100);
    });
  })();
</script>
