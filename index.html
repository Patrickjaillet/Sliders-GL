<!-- §1.1 FOUC prevention: suppress the initial transition flash before first paint.
     Sliders GL ships a single light/medium-gray theme (see §2 of the roadmap) —
     there is no theme class to branch on. -->
<script>
  (function(){
    document.documentElement.classList.add('no-transition');
    window.addEventListener('load', function() {
      setTimeout(function(){ document.documentElement.classList.remove('no-transition'); }, 100);
    });
  })();
</script>
