[package]
name = "sliders-gl"
version = "1.0.0"
description = "Real-time GLSL shader editor, 100% Shadertoy-compatible"
authors = ["Patrick JAILLET"]
edition = "2021"
rust-version = "1.77"

# Silence unused-binary warning from Tauri
default-run = "sliders-gl"

[[bin]]
name = "sliders-gl"
path = "src/main.rs"

[lib]
name = "sliders_gl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# ── Tauri core ───────────────────────────────────────────────────────────────
tauri = { version = "2", features = ["protocol-asset",
  "tray-icon",          # System tray support
  "image-png",          # PNG icon loading
] }

# ── Tauri official plugins ───────────────────────────────────────────────────
tauri-plugin-window-state    = "2"     # Save/restore window size, position, maximize
tauri-plugin-global-shortcut = "2"     # Global keyboard shortcuts (F11, Escape)
tauri-plugin-dialog   = "2"     # Native open/save file dialogs
tauri-plugin-fs       = "2"     # File system read/write
tauri-plugin-shell    = "2"     # Open URLs / external processes
tauri-plugin-process  = "2"     # app.exit(), app.restart()

# ── Utilities ────────────────────────────────────────────────────────────────
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
log         = "0.4"
notify      = "6"          # Phase 1.2: file-system watcher (watch_file command)

[target.'cfg(target_os = "windows")'.dependencies]
# Mica / Acrylic blur effect on Windows 10/11
window-vibrancy = "0.5"
# Windows API for reading accent colour
windows = { version = "0.58", features = [
  "UI_ViewManagement",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
# Minimise binary size + maximise runtime performance
panic      = "abort"    # Remove panic unwinding overhead
opt-level  = 3
lto        = true       # Link-time optimisation across crates
codegen-units = 1       # Single codegen unit for best LTO
strip      = true       # Strip debug symbols from release binary

[profile.dev]
opt-level  = 0
debug      = true
