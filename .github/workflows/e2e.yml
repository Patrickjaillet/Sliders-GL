# .github/workflows/e2e.yml — Phase 12.3
#
# E2E tests with Playwright (web mode — no Tauri required).
# Runs on main/develop push and PRs; limited to browser-based tests.

name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test tests/e2e/ --reporter=github
        env:
          ZGL_BASE_URL: http://localhost:5173
          CI: 'true'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test videos on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-videos
          path: test-results/
          retention-days: 3
