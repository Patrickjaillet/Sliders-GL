# .github/workflows/ci.yml — Phase 12.3
#
# Z-GL CI/CD Pipeline
# Runs on every PR and push to main/develop.
# Steps:
#   1. Lint + format check
#   2. Unit tests (Vitest) with coverage
#   3. Windows Tauri build (on tag or main push)
#   4. Attach installer artifact to GitHub Release on tag push
#
# ── REQUIRED GITHUB SECRETS (Fix 5.3) ────────────────────────────────────────
# The following secrets must be set in Settings → Secrets and variables → Actions:
#
#   TAURI_UPDATER_PUBKEY  — Public key for the Tauri auto-updater bundle signing.
#                           Generate with: npx tauri signer generate
#                           Copy the PUBLIC key content here.
#                           Used by: build-windows job (tauri build --bundles)
#
#   TAURI_PRIVATE_KEY     — Private key for signing the auto-updater manifest
#                           (latest.json). Used by: release job (tauri signer sign).
#                           KEEP SECRET — never commit to the repo.
#
#   TAURI_KEY_PASSWORD    — Optional passphrase for the private key.
#                           Leave empty if generated without --password.
#
# Without TAURI_UPDATER_PUBKEY the build-windows job will fail at `tauri build`.
# Without TAURI_PRIVATE_KEY the release job skips the update manifest signing step.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  RUST_TOOLCHAIN: stable

# ─────────────────────────────────────────────────────────────────────────────
jobs:
# ─────────────────────────────────────────────────────────────────────────────

  # ── Job 1: Lint, format, typecheck ─────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check (JSDoc + tsc)
        # tsc --noEmit using jsconfig.json / tsconfig.json with checkJs
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json — skipping type check"
          fi

  # ── Job 2: Unit tests ──────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest unit tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: false

      - name: Run transpiler benchmark
        run: |
          if npm run benchmark --if-present 2>/dev/null; then
            echo "Benchmark completed"
          else
            echo "No benchmark script — skipping"
          fi

  # ── Job 3: Windows Tauri build ─────────────────────────────────────────────
  build-windows:
    name: Windows Build (Tauri)
    runs-on: windows-latest
    needs: test
    # Only build on push to main or on version tags — not on every PR
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust (${{ env.RUST_TOOLCHAIN }})
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: z-gl-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
          if-no-files-found: warn

  # ── Job 4: GitHub Release on tag ───────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: z-gl-windows-installer
          path: ./dist

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Z-GL ${{ steps.version.outputs.VERSION }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── SÉCURITÉ C7 : Générer et signer latest.json pour l'auto-updater ──────
      # La signature est calculée par `tauri signer sign` avec la clé privée
      # stockée dans le secret GitHub TAURI_PRIVATE_KEY.
      # Si la clé est absente ou la signature vide, le job échoue intentionnellement
      # pour empêcher la publication d'un manifeste non sécurisé.
      - name: Sign and publish latest.json for auto-updater
        if: "!contains(steps.version.outputs.VERSION, '-')"
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.VERSION }}
          EXE_PATH="dist/z-gl_${VERSION}_x64-setup.exe"

          if [ -z "${TAURI_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_PRIVATE_KEY secret is not set — cannot sign update manifest."
            echo "Run 'tauri signer generate' and add the private key as a GitHub secret."
            exit 1
          fi

          if [ ! -f "$EXE_PATH" ]; then
            echo "::warning::Installer not found at $EXE_PATH — skipping update manifest"
            exit 0
          fi

          # Signer le binaire installateur avec la clé Tauri
          SIG=$(npx tauri signer sign \
                  --private-key "${TAURI_PRIVATE_KEY}" \
                  --password "${TAURI_KEY_PASSWORD:-}" \
                  "$EXE_PATH" 2>&1 | grep -E '^[A-Za-z0-9+/=]{80,}$' | head -1)

          if [ -z "$SIG" ]; then
            echo "::error::Signature generation failed or produced empty output. Aborting."
            exit 1
          fi

          cat > latest.json << MANIFEST
          {
            "version": "${VERSION}",
            "notes": "See https://github.com/${GH_REPO}/releases/tag/${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIG}",
                "url": "https://github.com/${GH_REPO}/releases/download/${VERSION}/z-gl_${VERSION}_x64-setup.exe"
              }
            }
          }
          MANIFEST

          echo "Update manifest signed and created:"
          # N'afficher que les 80 premiers caractères de la signature pour le log
          cat latest.json | sed "s/\"signature\": \".\{80\}.\+\"/\"signature\": \"<${#SIG} chars>\"/g"

          # Déploiement vers l'endpoint de mise à jour
          # (à remplacer par un upload vers votre CDN / bucket S3 / endpoint dédié)
          # Exemple : aws s3 cp latest.json s3://update.zgl.app/latest.json
          echo "::notice::Déployer latest.json vers votre endpoint https://update.zgl.app/"
