<!-- WGSL → GLSL Preview Panel
     Drop this fragment into the editor split layout (alongside #wgslPane).
     The panel is hidden by default; toggled via toggleWGSLToGLSLPreview(). -->
<div id="wgslToGlslPane" hidden
     style="flex:1;display:flex;flex-direction:column;min-width:280px;max-width:50%;
            border-left:1px solid #2a2d32;overflow:hidden;">

  <!-- Panel header -->
  <div style="display:flex;align-items:center;justify-content:space-between;
              padding:4px 10px;background:#1a1d22;border-bottom:1px solid #2a2d32;
              flex-shrink:0;user-select:none;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:11px;font-weight:600;color:#ccc;letter-spacing:.03em;">
        WGSL → GLSL
      </span>
      <span style="font-size:10px;color:#555;">WebGL fallback preview</span>
    </div>
    <span id="wgslToGlslSubtitle"
          style="font-size:10px;color:#888;font-style:italic;"></span>
  </div>

  <!-- Read-only Monaco editor mounts here -->
  <div id="wgslToGlslMc" style="flex:1 1 0;min-height:100px;"></div>

</div>
